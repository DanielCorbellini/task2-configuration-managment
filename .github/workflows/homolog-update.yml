# Utilizado sempre após o CI de Homologação for realizado
name: Homolagação (CD) - Update de código

on:
  workflow_dispatch:

jobs:
  update-homolog:
    runs-on: self-hosted
    steps:
    - name: Atualização do ambiente de Homologação
      run: |
        # 1. Faz login
        docker login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
    
        # 2. Garante que o container antigo seja removido para não dar conflito de nome/porta
        docker rm -f meu-app-homolog || true
    
        # 3. Puxa e roda direto em uma linha só!
        docker run -d \
          --name meu-app-homolog \
          -p 8080:80 \
          --restart always \
          ghcr.io/danielcorbellini/task2-configuration-managment:homolog
    
        # 4. Limpa credenciais
        docker logout ghcr.io
