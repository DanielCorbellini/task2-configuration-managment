# Utilize sempre que novos commits são feitos na branch homolog ou quando é realizado primeiro build
name: Homolagação (CI) - Testes e Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  qualidade-codigo:
    uses: ./.github/workflows/pylint.yml

  testes:
    uses: ./.github/workflows/tests.yml
    with:
      ref: homolog
    permissions:
      contents: read
      checks: write
      pull-requests: write

  deploy-homolog:
    needs: [qualidade-codigo, testes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Login no GitHub Container Registry # Serviço nativo do GitHub para hospedar imagens de contêineres
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define o nome do repositório do github em lowercase # Serve para construir a imagem (limitação do docker)
        env:
          REPO_NAME: "${{ github.repository }}"
        run: |
          echo "REPO_LOWER=${REPO_NAME,,}" >>${GITHUB_ENV}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: . # Diretório atual
          push: true # Imagem é compilada e assim que terminar de ser construída localmente é feito o push dela para o servidor do GitHub Container Registry (GHCR)
          tags: ghcr.io/${{ env.REPO_LOWER }}:homolog

  abrir-pr:
    needs: [deploy-homolog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Abrir PR para main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "CI: deploy homolog"
          title: "Homolog -> Main: Atualização de Pacote"
          body: |
            ## 📝 Descrição
            - Deploy de Homologação Concluído!

            ### 📌 Informações do PR
            * **Origem:** `homolog`
            * **Destino:** `main` (Produção)
            * **Gatilho:** Automatizado via GitHub Actions

            ## ⚠️ Revisão Necessária
            Este PR foi gerado automaticamente após o sucesso do deploy em homologação.
            Por favor, revise as alterações e aprove o merge para liberar na produção.

            > **Atenção:** Não fazer merge sem revisar.
          base: main
          head: homolog
