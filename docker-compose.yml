services:
  # --------------- Banco de Dados PostgreSQL ---------------
  db:
    image: postgres:16-alpine
    container_name: db-${APP_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # DB_PORT_HOST define a porta exposta no host
      - "${DB_PORT_HOST}:5432"
    volumes:
      # Persiste os dados do banco entre recriações do contêiner
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lancamentos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------- Aplicação Flask ---------------
  app:
    image: ghcr.io/danielcorbellini/task2-configuration-managment:${APP_TAG:-latest}
    container_name: app-${APP_TAG}
    restart: unless-stopped
    ports:
      # APP_PORT_HOST define a porta exposta no host (padrão: 5001 para homolog)
      - "${APP_PORT_HOST}:5000"
    env_file:
      - .env
    environment:
      # Sobrescreve o DB_HOST para apontar ao serviço "db" do Compose
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
